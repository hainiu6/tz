name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.22"}
      - name: Build binaries
        env: {VERSION: "${{ github.ref_name }}"}
        run: |
          sh scripts/build-release.sh
      - uses: softprops/action-gh-release@v2
        with: {files: "dist/*"}

