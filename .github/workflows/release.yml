name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.22"}
      - name: Build binaries
        env: {VERSION: "${{ github.ref_name }}"}
        run: |
          mkdir -p dist
          for arch in amd64 arm64 arm; do
            suffix="$arch"; goarch="$arch"; goarm=""
            if [ "$arch" = arm ]; then suffix="armv7"; goarm="7"; fi
            CGO_ENABLED=0 GOOS=linux GOARCH="$goarch" GOARM="$goarm" go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/tz-agent-linux-$suffix" ./cmd/agent
          done
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o dist/tz-panel-linux-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o dist/tz-panel-linux-arm64 ./cmd/server
          (cd dist && sha256sum * > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with: {files: "dist/*"}

