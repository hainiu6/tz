name: Import local TZ history
on:
  push:
    branches: [main]
    paths: ["tz-migration.bundle.b64"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Restore and verify complete local history
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/tz-migration.bundle"
          base64 --decode tz-migration.bundle.b64 > "$bundle"
          git bundle verify "$bundle"
          git fetch "$bundle" main:refs/heads/migration-source
          source_commit=$(git rev-parse migration-source)
          source_tree=$(git rev-parse migration-source^{tree})
          test "$source_commit" = "ae3f93a2624bb834662a3796607c2cffcc3f3363"
          test "$source_tree" = "351b4925e743b3a36b42316af0905ea431f78c57"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          imported=$(printf '%s\n' 'Restore TZ source and complete Git history in hainiu6/tz' | git commit-tree "$source_tree" -p "$GITHUB_SHA" -p "$source_commit")
          git checkout --detach "$imported"
          test "$(git ls-files | wc -l | tr -d ' ')" = 42
          test "$(git rev-parse HEAD^{tree})" = "$source_tree"
          go test ./...
          go vet ./...
          node --test scripts/test-web.cjs
          bash -n scripts/install-panel.sh internal/assets/scripts/install-agent.sh internal/assets/scripts/uninstall-agent.sh
          git push origin HEAD:refs/heads/main
